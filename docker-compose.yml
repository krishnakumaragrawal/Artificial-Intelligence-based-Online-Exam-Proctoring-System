services:
  frontend:
    build:
      context: ./frontend
    environment:
      API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - evidence:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proctoring
      POSTGRES_USER: proctoring
      POSTGRES_PASSWORD: proctoring
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proctoring -d proctoring"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evidence:
  postgres-data:
